[project]
name = "vanta-omens"
version = "0.1.0"
description = "Tensorlake Orchestrate application for remediating Vanta source repository vulnerabilities."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tensorlake>=0.5.47",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
